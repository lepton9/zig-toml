name: test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        zig-version: ['0.16.0']

    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Check format
        run: zig fmt --check ./*.zig src/*.zig
      - name: Run tests
        run: zig build test
      - name: Run test suite
        run: zig build test-suite
